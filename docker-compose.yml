version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: truthlens_postgres
    environment:
      POSTGRES_USER: truthlens
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: truthlensdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthlens -d truthlensdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: truthlens_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: truthlens_backend
    environment:
      - DATABASE_URL=postgresql://truthlens:changeme@postgres:5432/truthlensdb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=please-change-this-to-a-secure-random-string-in-production
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: infra/docker/celery.Dockerfile
    container_name: truthlens_celery
    environment:
      - DATABASE_URL=postgresql://truthlens:changeme@postgres:5432/truthlensdb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=please-change-this-to-a-secure-random-string-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: truthlens_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: truthlens_nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
