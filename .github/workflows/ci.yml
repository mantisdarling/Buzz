name: TruthLens CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install ML dependencies
        run: |
          pip install -r ml/requirements.txt
          python -m spacy download en_core_web_lg

      - name: Set test environment variables
        run: |
          echo "DATABASE_URL=sqlite:///:memory:" >> $GITHUB_ENV
          echo "SECRET_KEY=ci-test-secret-key-at-least-32-chars" >> $GITHUB_ENV

      - name: Run backend pytest suite
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit --skipLibCheck || true

      - name: Build Next.js production app
        working-directory: frontend
        run: npm run build
